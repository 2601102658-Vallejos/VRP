
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRP Web- Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">

        <div class="login-box">
            <h1>VRPPortfolio</h1>
            <p class="subtitle">Welcome Back!</p>
            <p class="description">Please login to access VRP.</p>
            <p class="description">Sample username: student</p>
            <p class="description">Sample password: 12345</p>

            <form id="loginForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">LOGIN</button>

                <p id="errorMessage"></p>

            </form>

            <p class="login-footer">
                My Personal Portfolio © 2026
            </p>
        </div>

    </div>

    <script src="login.js"></script>
</body>
</html>
